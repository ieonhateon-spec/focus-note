<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="집중 노트">
<title>집중 노트</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/dist/tabler-icons.min.css">
<style>
@font-face{font-family:F;src:url(https://cdn.jsdelivr.net/gh/Project-Noonnu/2607161334@griun-fromsol-rg/griun-fromsol-rg/Griun_Fromsol-Rg.woff2)}
*{box-sizing:border-box;font-family:F,sans-serif;font-weight:400}
.ti{font-family:tabler-icons!important}
body{margin:0;padding:28px 20px 28px 60px;color:#3b3f45;font-size:17px;line-height:1.6;background:linear-gradient(90deg,#0000 40px,#e0b4a8 40px 42px,#0000 42px),repeating-linear-gradient(#f7f3ea 0 31px,#e6dfd0 31px 32px)}
.w{max-width:560px;margin:auto}
h1{margin:0;font-size:32px;display:inline-block;background:linear-gradient(#0000 60%,#d6ba6e73 60%);padding:0 4px}
.g{color:#8a8478;font-size:16px;margin:0 0 6px}
.c{position:relative;background:#fffdf8;border:1px solid #e3dccd;border-radius:4px;padding:24px 20px 18px;margin-bottom:22px}
.c:before{content:'';position:absolute;top:-11px;left:50%;width:92px;height:22px;transform:translate(-50%) rotate(-2deg);background:repeating-linear-gradient(90deg,#fff3 0 2px,#0000 2px 7px),var(--t,#c9a85cb8);clip-path:polygon(0 0,100% 0,96% 16%,100% 32%,95% 50%,100% 67%,96% 84%,100% 100%,0 100%,4% 84%,0 68%,5% 50%,0 33%,4% 17%)}
.t2{--t:#c9988cb8}.t2:before{transform:translate(-50%) rotate(2deg)}.t3{--t:#7d9a85b8}
input{width:100%;height:42px;padding:0 4px;border:0;border-bottom:2px solid #d9d1bf;border-radius:0;font-size:18px;color:inherit;background:#0000;outline:0}
button{height:42px;padding:0 14px;border:1.5px solid #5a6e60;border-radius:8px;background:#fffdf8;font-size:17px;color:#4a5a4f}
.m{background:#5a6e60;color:#fffdf8}
.ch{height:auto;font-size:15px;padding:4px 12px;border:1px solid #d9d1bf;color:#8a8478}
.on{border-color:#5a6e60;color:#3b3f45;background:linear-gradient(#0000 55%,#d6ba6e73 55%)}
.e{font-size:15px;color:#b4574a;margin:4px 0 0;min-height:20px}
.st{display:flex;justify-content:space-around;margin:6px 0 26px}
.s{width:clamp(88px,26vw,118px);aspect-ratio:1;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;box-shadow:0 3px 8px #3c372d1f}
.s:after{content:'';position:absolute;inset:6px;border:1.5px dashed #fffdf8e6;border-radius:50%}
.s i{font-size:18px;opacity:.7}.s p{margin:0;line-height:1.25;font-size:13px}.s b{font-size:24px;font-weight:400;line-height:1.25}
.s:nth-child(1){background:#c7d1bf;rotate:-6deg}.s:nth-child(2){background:#dcc3b4;rotate:4deg}.s:nth-child(3){background:#c9d0d8;rotate:-3deg}
.r{height:12px;border:1.5px solid #5a6e60;border-radius:3px;overflow:hidden;margin-bottom:16px;background:repeating-linear-gradient(90deg,#d9d1bf 0 1px,#0000 1px 10%)}
.row{display:flex;align-items:center;gap:10px;padding:6px 0;border-bottom:1px solid #e6dfd0;font-size:18px}
.row button{height:28px;width:28px;padding:0;border:0;font-size:20px;background:#0000}
</style>
</head>
<body>
<div class="w">
<div style="margin-bottom:24px"><h1><i class="ti ti-notebook"></i> 집중 노트</h1><p class="g" style="margin-top:4px">오늘도 한 페이지씩</p></div>
<div class="c">
<p class="g"><i class="ti ti-pencil"></i> 지금 할 일 딱 하나</p>
<input id="tk" placeholder="과학 프린트 2쪽 읽기">
<p id="te" class="e"></p>
<p class="g">집중 시간</p>
<div style="display:flex;gap:8px"><button class="ch" data-v="10">10분</button><button class="ch on" data-v="15">15분</button><button class="ch" data-v="25">25분</button></div>
</div>
<div class="c t2" style="text-align:center">
<p id="md" class="g" style="margin:0">준비됐으면 시작!</p>
<p id="ck" style="margin:4px 0;font-size:66px;line-height:1.2">15:00</p>
<p id="nt" style="margin:0 0 12px;min-height:26px;font-size:18px"></p>
<div class="r"><div id="bar" style="height:100%;width:0;background:#7d9a85"></div></div>
<div style="display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
<button id="go" class="m"><i class="ti ti-player-play"></i> 시작</button>
<button id="rs"><i class="ti ti-eraser"></i> 처음부터</button>
<button id="op"><i class="ti ti-arrow-back-up"></i> 앗 딴짓했다</button>
</div>
<p id="ms" style="margin:12px 0 0;color:#5a7a62;min-height:22px"></p>
</div>
<div class="st">
<div class="s"><i class="ti ti-star"></i><p>오늘 완료</p><b id="dn">0회</b></div>
<div class="s"><i class="ti ti-arrow-back-up"></i><p>돌아온 횟수</p><b id="bk">0번</b></div>
<div class="s"><i class="ti ti-clock"></i><p>오늘 집중</p><b id="tt">0분</b></div>
</div>
<div class="c t3">
<p class="g"><i class="ti ti-bulb"></i> 딴생각은 요기에!!</p>
<div style="display:flex;gap:8px;align-items:center"><input id="pk" placeholder="유튜브 그 영상 보기" style="flex:1"><button id="ad" class="m"><i class="ti ti-plus"></i></button></div>
<p id="pe" class="e"></p>
<div id="pl"></div>
</div>
</div>
<script>
const $=i=>document.getElementById(i),T=new Date().toDateString(),P='<i class="ti ti-player-play"></i> ';
let S={d:T,n:0,b:0,f:0,p:[]};
try{const s=JSON.parse(localStorage.getItem('fn'));if(s){S.p=s.p||[];if(s.d===T)S=s}}catch(e){}
const sv=()=>{try{localStorage.setItem('fn',JSON.stringify(S))}catch(e){}};
let M=15,L=900,TT=900,R=0,E=0,K,B=0;
const f=s=>String(s/60|0).padStart(2,'0')+':'+String(s%60).padStart(2,'0');
const C=['좋아요, 다시 왔으니 된 거예요','괜찮아요! 돌아온 게 진짜 실력','딴짓은 누구나 해요. 다시 고고','숨 한 번 쉬고, 할 일 하나만 봐요'];
function st(){$('dn').textContent=S.n+'회';$('bk').textContent=S.b+'번';$('tt').textContent=S.f+'분'}
function dr(){$('ck').textContent=f(L);$('bar').style.width=Math.round((1-L/TT)*100)+'%';$('bar').style.background=B?'#7b93a8':'#7d9a85';document.title=R?f(L)+' 집중 중':'집중 노트'}
function bp(){try{const a=new(window.AudioContext||window.webkitAudioContext)();[0,.25,.5].forEach(t=>{const o=a.createOscillator(),g=a.createGain();o.frequency.value=880;g.gain.value=.15;o.connect(g);g.connect(a.destination);o.start(a.currentTime+t);o.stop(a.currentTime+t+.15)})}catch(e){}}
function sp(){R=0;clearInterval(K);$('go').innerHTML=P+(L<TT?'계속':'시작')}
function fin(){sp();bp();if(!B){S.n++;S.f+=M;sv();st();B=1;TT=L=300;$('md').textContent='쉬는 시간 5분 (일어나서 물 한 잔!)';$('ms').textContent='한 판 끝! 정말 잘했어요';$('go').innerHTML=P+'휴식 시작'}else{B=0;TT=L=M*60;$('md').textContent='쉬는 시간 끝, 다음 판 가 볼까요?';$('ms').textContent='';$('go').innerHTML=P+'시작'}dr()}
$('go').onclick=()=>{if(R){sp();$('md').textContent='잠깐 멈춤';return}const t=$('tk').value.trim();if(!B&&!t){$('te').textContent='할 일을 먼저 하나 적어 주세요';return}R=1;E=Date.now()+L*1000;$('go').innerHTML='<i class="ti ti-player-pause"></i> 멈춤';if(!B){$('md').textContent='집중하는 중';$('nt').textContent='지금은: '+t;$('ms').textContent=''}K=setInterval(()=>{L=Math.max(0,Math.round((E-Date.now())/1000));dr();if(L<=0)fin()},250)};
$('rs').onclick=()=>{sp();B=0;TT=L=M*60;$('md').textContent='준비됐으면 시작!';$('nt').textContent='';$('ms').textContent='';$('go').innerHTML=P+'시작';dr()};
$('op').onclick=()=>{S.b++;sv();st();$('ms').textContent=C[Math.random()*C.length|0]};
$('tk').oninput=()=>$('te').textContent='';
document.querySelectorAll('.ch').forEach(c=>c.onclick=()=>{if(R)return;document.querySelectorAll('.ch').forEach(x=>x.classList.remove('on'));c.classList.add('on');M=+c.dataset.v;if(!B){TT=L=M*60;dr()}});
function rp(){$('pl').innerHTML='';S.p.forEach((v,i)=>{const r=document.createElement('div'),s=document.createElement('span'),x=document.createElement('button');r.className='row';s.style.flex=1;s.textContent=v;x.innerHTML='<i class="ti ti-square"></i>';x.onclick=()=>{x.innerHTML='<i class="ti ti-square-check"></i>';s.style.textDecoration='line-through';setTimeout(()=>{S.p.splice(i,1);sv();rp()},400)};r.append(x,s);$('pl').append(r)})}
function ap(){const v=$('pk').value.trim();if(!v){$('pe').textContent='딴생각을 적어 주세요';return}S.p.push(v);sv();rp();$('pk').value='';$('ms').textContent='적어 뒀으니 이제 잊어도 돼요'}
$('ad').onclick=ap;$('pk').onkeydown=e=>{if(e.key==='Enter')ap()};$('pk').oninput=()=>$('pe').textContent='';
st();rp();dr();
</script>
</body>
</html>
